name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (api)
        run: npx tsc -p tsconfig.api.json --noEmit

      - name: Test
        run: npx vitest run
